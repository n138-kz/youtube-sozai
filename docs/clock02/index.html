<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock02 | n138-kz.github.io</title>
    <link rel="stylesheet" href="css-var-declare.css">
	<style>
        html, body {
			margin: 0;
			padding: 0 5px;
            color: var(--text-color);
			background-color: var(--background-color);
            font-size: var(--text-size);
			overflow: hidden;
		}
        #nowtime {
            width: 180px;
            text-align: center;
            background-color: var(--background-color-itemblock);
			margin: 0;
			padding: 0;
            border-radius: 0 0 25px 25px;
        }
        #nowtime div[data-id="l1"] {
            border: 1px solid var(--text-color);
            width: 6ex;
            font-size: calc(var(--text-size) * 0.7);
            margin: 0 auto;
            line-height: 1;
        }
        #nowtime div[data-id="l2"] {
            border-bottom: 1px solid var(--text-color);
            width: 150px;
            margin: 0 auto;
        }
        #nowtime [data-id="t2"] {
            font-size: 0.5em;
        }
        #nowtime [data-id="d2"] {
            font-size: 0.5em;
        }
        #nowtime [data-id="d2"]::before {
            content: '(';
        }
        #nowtime [data-id="d2"]::after {
            content: ')';
        }
        @keyframes colon-blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nowtime = document.getElementById('nowtime');
            const t1 = nowtime.querySelector('span[data-id="t1"]');
            const t2 = nowtime.querySelector('span[data-id="t2"]');
            const d1 = nowtime.querySelector('span[data-id="d1"]');
            const d2 = nowtime.querySelector('span[data-id="d2"]');
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            function updateTime() {
                const now = new Date();
                const t1h = document.createElement('span');
                t1h.textContent = String(now.getHours()).padStart(2, '0');
                const t1m = document.createElement('span');
                t1m.textContent = String(now.getMinutes()).padStart(2, '0');
                const t1s = document.createElement('span');
                t1s.textContent = String(now.getSeconds()).padStart(2, '0');
                const t1colon = document.createElement('span');
                t1colon.textContent = ':';
                t1colon.style.animation = 'colon-blink 1s step-start infinite';

                t1.innerHTML = `${t1h.outerHTML}${t1colon.outerHTML}${t1m.outerHTML}`;
                d1.textContent = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
                d2.textContent = `${dayNames[now.getDay()]}`;
                t2.innerHTML = t1s.outerHTML;
            }
            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</head>
<body>
    <div id="nowtime">
        <div data-id="l1">LIVE</div>
        <div data-id="l2">
            <span data-id="t1"></span>
            <span data-id="t2"></span>
        </div>
        <div data-id="l3">
            <span data-id="d1"></span>
            <span data-id="d2"></span>
        </div>
    </div>
</body>
</html>
