<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock02 | n138-kz.github.io</title>
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="referrer" content="no-referrer" />
	<link rel="stylesheet" type="text/css" href="/lib/master.css?t=0" />
	<script src="/lib/master.js"></script>
    <link rel="stylesheet" href="css-var-declare.css">
	<style>
        html, body {
			margin: 0;
			padding: 0 5px;
            color: var(--text-color);
			background-color: var(--background-color);
            font-size: var(--text-size);
			overflow: hidden;
		}
        #nowtime {
            width: 180px;
            text-align: center;
            background-color: var(--background-color-itemblock);
			margin: 0;
            margin-bottom: 300px;
			padding: 0;
            border-radius: 0 0 25px 25px;
        }
        #nowtime div[data-id="l1"] {
            border: 1px solid var(--text-color-str-live);
            width: 6ex;
            color: var(--text-color-str-live);
            font-size: calc(var(--text-size) * 0.7);
            margin: 0 auto;
            line-height: 1;
            border-radius: 25px;

            animation: blink-animation-2 3s infinite;
        }
        #nowtime div[data-id="l2"] {
            border-bottom: 1px solid var(--text-color);
            width: 150px;
            margin: 0 auto;
            line-height: 1;
        }
        #nowtime div[data-id="l3"] {
            line-height: 1.3;
        }
        #nowtime [data-id="t2"] {
            font-size: 0.5em;
        }
        #nowtime [data-id="d2"] {
            font-size: 0.5em;
        }
        #nowtime [data-id="d2"]::before {
            content: '(';
        }
        #nowtime [data-id="d2"]::after {
            content: ')';
        }
        table,table th,table td {
            background-color: white;
            color: #333;
            border: solid 1px #333;
            font-size: 16pt;
        }
        @keyframes blink-animation {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes blink-animation-2 {
            0% { opacity: 1; }
            40% { opacity: 0; }
            80% { opacity: 1; }
            100% { opacity: 1; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const colorDefaultFontTextInput = document.getElementById('color-default-font-text');
            const colorLiveFontTextInput = document.getElementById('color-live-font-text');
            const backgroundColorDefaultInput = document.getElementById('color-default-style-background');
            const backgroundColorItemBlockInput = document.getElementById('color-itemblock-style-background');

            const startupEvent = new Event('input', { bubbles: true });

            colorDefaultFontTextInput.addEventListener('input', (event) => {
                const newColor = event.target.value;
                document.documentElement.style.setProperty('--text-color', newColor);
                document.getElementById('print-color-default-font-text').innerText = newColor;
            });
            colorDefaultFontTextInput.value = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
            colorDefaultFontTextInput.dispatchEvent(startupEvent);

            colorLiveFontTextInput.addEventListener('input', (event) => {
                const newColor = event.target.value;
                document.documentElement.style.setProperty('--text-color-str-live', newColor);
                document.getElementById('print-color-live-font-text').innerText = newColor;
            });
            colorLiveFontTextInput.value = getComputedStyle(document.documentElement).getPropertyValue('--text-color-str-live').trim();
            colorLiveFontTextInput.dispatchEvent(startupEvent);

            backgroundColorDefaultInput.addEventListener('input', (event) => {
                const newColor = event.target.value;
                document.documentElement.style.setProperty('--background-color', newColor);
                document.getElementById('print-color-default-style-background').innerText = newColor;
            });
            backgroundColorDefaultInput.value = getComputedStyle(document.documentElement).getPropertyValue('--background-color').trim();
            backgroundColorDefaultInput.dispatchEvent(startupEvent);

            backgroundColorItemBlockInput.addEventListener('input', (event) => {
                const newColor = event.target.value;
                document.documentElement.style.setProperty('--background-color-itemblock', newColor);
                document.getElementById('print-color-itemblock-style-background').innerText = newColor;
            });
            backgroundColorItemBlockInput.value = getComputedStyle(document.documentElement).getPropertyValue('--background-color-itemblock').trim();
            backgroundColorItemBlockInput.dispatchEvent(startupEvent);
        });
        document.addEventListener('DOMContentLoaded', () => {
            const nowtime = document.getElementById('nowtime');
            const t1 = nowtime.querySelector('span[data-id="t1"]');
            const t2 = nowtime.querySelector('span[data-id="t2"]');
            const d1 = nowtime.querySelector('span[data-id="d1"]');
            const d2 = nowtime.querySelector('span[data-id="d2"]');
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            function updateTime() {
                const now = new Date();
                const t1h = document.createElement('span');
                t1h.textContent = String(now.getHours()).padStart(2, '0');
                const t1m = document.createElement('span');
                t1m.textContent = String(now.getMinutes()).padStart(2, '0');
                const t1s = document.createElement('span');
                t1s.textContent = String(now.getSeconds()).padStart(2, '0');
                const t1colon = document.createElement('span');
                t1colon.textContent = ':';
                t1colon.style.animation = 'blink-animation 1s step-start infinite';

                t1.innerHTML = `${t1h.outerHTML}${t1colon.outerHTML}${t1m.outerHTML}`;
                d1.textContent = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
                d2.textContent = `${dayNames[now.getDay()]}`;
                t2.innerHTML = t1s.outerHTML;
            }
            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</head>
<body>
    <div id="nowtime">
        <div data-id="l1">LIVE</div>
        <div data-id="l2">
            <span data-id="t1"></span>
            <span data-id="t2"></span>
        </div>
        <div data-id="l3">
            <span data-id="d1"></span>
            <span data-id="d2"></span>
        </div>
    </div>
    <div>
        <table data-id="control">
            <tr>
                <td><code>--text-color</code></td>
                <td>
                    <input type="color" value="var(--text-color)" id="color-default-font-text">
                    <output id="print-color-default-font-text"></output>
                </td>
            </tr>
            <tr>
                <td><code>--text-color-str-live</code></td>
                <td>
                    <input type="color" value="var(--text-color-str-live)" id="color-live-font-text">
                    <output id="print-color-live-font-text"></output>
                </td>
            </tr>
            <tr>
                <td><code>--background-color</code></td>
                <td>
                    <input type="color" value="var(--background-color)" id="color-default-style-background">
                    <output id="print-color-default-style-background"></output>
                </td>
            </tr>
            <tr>
                <td><code>--background-color-itemblock</code></td>
                <td>
                    <input type="color" value="var(--background-color-itemblock)" id="color-itemblock-style-background">
                    <output id="print-color-itemblock-style-background"></output>
                </td>
            </tr>
        </table>
    </div>
    <div>
        <table>
            <tr>
                <td colspan="3">OBS</td>
            </tr>
            <tr>
                <td rowspan="5"> </td>
                <td>URL</td>
                <td>https://n138-kz.github.io/youtube-sozai/clock02/</td>
            </tr>
            <tr>
                <td>幅</td>
                <td>200</td>
            </tr>
            <tr>
                <td>高さ</td>
                <td>100</td>
            </tr>
            <tr>
                <td>カスタムCSS</td>
                <td><textarea style="width: stretch; height: 3em;">:root {--text-size: 24pt;--text-color-str-live: #fff;} body { background-color: rgba(0, 0, 0, 0); margin: 0px auto; overflow: hidden; } .ad-container,#social_icon,iframe {display:none;}</textarea></td>
            </tr>
            <tr>
                <td>カスタムCSS（LIVEの点滅無し）</td>
                <td><textarea style="width: stretch; height: 3em;">:root {--text-size: 24pt;--text-color-str-live: #fff;} body { background-color: rgba(0, 0, 0, 0); margin: 0px auto; overflow: hidden; } .ad-container,#social_icon,iframe {display:none;}#nowtime div[data-id="l1"]{animation:none;}</textarea></td>
            </tr>
        </table>
    </div>
</body>
</html>
